<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0d1a">
  <title>Avala Run — Kluboslavija 2026</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/ui.css">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div id="hud-left"><span id="score-display">0</span><span id="card-display">🎫 0</span></div>
      <div id="hud-right"><span id="trash-display">🗑️ 0</span></div>
    </div>
    <div id="menu" class="overlay">
      <div class="menu-inner">
        <h1>AVALA RUN</h1>
        <div class="subtitle">Kluboslavija · Avala · 20. jun 2026.</div>
        <div class="controls">
          <div>⬆ ArrowUp / Space — Skok</div>
          <div>⬇ ArrowDown / S — Duck (sagnuti se)</div>
          <div>📱 Tap gornju polovinu — Skok</div>
          <div>📱 Tap donju polovinu — Duck</div>
        </div>
        <div class="menu-goal">Skupljaj 🎫 karte i 🗑️ smeće. Izbegavaj prepreke!</div>
        <button class="btn-start" id="btn-menu-start">KRETANJE!</button>
      </div>
    </div>
    <div id="game-over" class="overlay hidden"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
