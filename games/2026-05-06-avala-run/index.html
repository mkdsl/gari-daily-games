<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0d1a">
  <title>Avala Run — Kluboslavija 2026</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/ui.css">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div id="hud-left"><span id="score-display">0</span></div>
      <div id="hud-right"><span id="trash-display">0 smeća</span></div>
    </div>
    <div id="menu" class="overlay">
      <div class="menu-inner">
        <h1>AVALA RUN</h1>
        <div class="subtitle">Kluboslavija · Avala · 20. jun 2026.</div>
        <div class="controls">
          <div><span class="icon icon-arrow-up"></span> ArrowUp / Space — Skok</div>
          <div><span class="icon icon-arrow-down"></span> ArrowDown / S — Duck (sagnuti se)</div>
          <div><span class="icon icon-phone"></span> Tap gornju polovinu — Skok</div>
          <div><span class="icon icon-phone"></span> Tap donju polovinu — Duck</div>
        </div>
        <div class="menu-goal">Očisti Avalu! Skupljaj smeće — <span class="icon icon-arrow-up"></span> za visoko, <span class="icon icon-arrow-down"></span> za nisko.<br><span class="icon icon-tree"></span> Drvo → skok ili duck &nbsp; <span class="icon icon-rock"></span> Kamen → skok<br><span class="icon icon-drone"></span> Dron → duck &nbsp; <span class="icon icon-truck"></span> Kamion → skok</div>
        <button class="btn-start" id="btn-menu-start">KRETANJE!</button>
        <button class="btn-face" id="btn-face">STAVI SVOJU FACU</button>
        <input type="file" accept="image/*" capture="user" id="face-input" style="display:none">
      </div>
    </div>
    <div id="game-over" class="overlay hidden"></div>
  </div>
  <script>window.onerror=function(m,s,l,c,e){document.title='ERR';var d=document.createElement('pre');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:red;color:white;padding:16px;font-size:14px;white-space:pre-wrap;word-break:break-all';d.textContent=m+'\n'+s+':'+l+':'+c+'\n'+(e&&e.stack||'');document.body.prepend(d)}</script>
  <script type="module" src="src/main.js?v=2"></script>
</body>
</html>
