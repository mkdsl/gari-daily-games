<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sound vs Tišina — Gari Daily Games</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/ui.css">
  <link rel="stylesheet" href="styles/game.css">
  <meta property="og:title" content="Sound vs Tišina">
  <meta property="og:description" content="Ti si promoter — podesi zvuk da dance floor živi a susedi spavaju.">
  <meta property="og:url" content="https://mkdsl.github.io/gari-daily-games/games/2026-05-22-sound-vs-tisina/">
</head>
<body>
  <div id="app">
    <!-- MENU -->
    <div id="screen-menu" class="screen active">
      <div class="menu-inner">
        <div class="menu-logo">🎛️</div>
        <h1 class="menu-title">Sound vs Tišina</h1>
        <p class="menu-sub">Ti si promoter. Podesi zvuk — dance floor živi, susedi spavaju.</p>
        <button id="btn-start" class="btn-primary">Počni karijeru</button>
        <div class="menu-credits">Gari Daily Games · 2026-05-22</div>
      </div>
    </div>

    <!-- VENUE SELECT -->
    <div id="screen-venue-select" class="screen">
      <div class="screen-header">
        <h2>Odaberi teren</h2>
        <div id="career-badge" class="career-badge">Rookie</div>
      </div>
      <div id="venue-grid" class="venue-grid"></div>
    </div>

    <!-- SETUP -->
    <div id="screen-setup" class="screen">
      <div class="screen-header">
        <h2 id="setup-title">Priprema</h2>
        <div id="setup-budget" class="budget-display">💰 0</div>
      </div>
      <div id="upgrades-grid" class="upgrades-grid"></div>
      <div class="setup-actions">
        <button id="btn-setup-back" class="btn-secondary">← Nazad</button>
        <button id="btn-setup-start" class="btn-primary">Pokreni žurku ▶</button>
      </div>
    </div>

    <!-- RUNNING -->
    <div id="screen-running" class="screen">
      <div id="hud" class="hud">
        <div id="hud-time" class="hud-time">22:00</div>
        <div id="hud-happiness" class="hud-happiness">
          <div class="happiness-bar-bg">
            <div id="happiness-bar-fill" class="happiness-bar-fill"></div>
          </div>
          <span id="happiness-emoji" class="happiness-emoji">😐</span>
        </div>
        <div class="hud-right">
          <div id="hud-budget" class="hud-budget">💰 0</div>
          <div id="hud-rep" class="hud-rep">⭐ 50</div>
        </div>
      </div>
      <div class="game-area">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="game-canvas" width="800" height="480"></canvas>
        </div>
        <div id="neighbor-thermometer" class="neighbor-thermometer">
          <div class="thermo-label">Komšija</div>
          <div class="thermo-track">
            <div id="thermo-fill" class="thermo-fill"></div>
            <div id="thermo-marker" class="thermo-marker"></div>
          </div>
          <div id="thermo-value" class="thermo-value">— dB</div>
          <div id="complaint-dots" class="complaint-dots">
            <span class="cdot" id="cdot-0">●</span>
            <span class="cdot" id="cdot-1">●</span>
            <span class="cdot" id="cdot-2">●</span>
          </div>
        </div>
      </div>
      <div id="zone-sliders" class="zone-sliders"></div>
      <div id="event-feed" class="event-feed"></div>
    </div>

    <!-- GAME OVER -->
    <div id="screen-gameover" class="screen">
      <div class="gameover-inner">
        <div id="go-result-icon" class="go-result-icon">🎉</div>
        <h2 id="go-title" class="go-title">Sjajno veče!</h2>
        <div id="go-stats" class="go-stats"></div>
        <div id="go-mentor" class="go-mentor"></div>
        <div class="go-cta-block">
          <p class="go-cta-text">Avala 20. jun — budi tamo kad to stvarno broji.</p>
          <button id="btn-karta" class="btn-cta">🎟️ Karta</button>
        </div>
        <div class="go-actions">
          <button id="btn-replay" class="btn-secondary">Igraj ponovo</button>
          <button id="btn-next-venue" class="btn-primary">Sledeći teren →</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
